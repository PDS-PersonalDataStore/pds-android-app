[package]
name = "pds-ffi"
version = "0.1.0"
edition = "2024"

[lib]
name = "pds_ffi"
crate-type = ["cdylib", "rlib"]

[dependencies]
pds = { version = "1.7.0", git = "https://github.com/Tau2C/pds-rs.git", branch = "master" }
jni = { version = "0.21.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
ulid = "3.0.0"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = "0.2.2"

[patch."https://github.com/Tau2C/pds-rs.git"]
pds = { path = "../.." }
